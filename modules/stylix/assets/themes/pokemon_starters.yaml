scheme: "Pokemon Starters"
variant: "dark"
author: "Anthony Butt (sampled from Gen 1 starters fractal art)"
# Dark theme built from the original trio: Bulbasaur, Squirtle, Charmander.
# Backgrounds: near-black with warm and cool undertones from the neon glow.
# Accents: hues follow the base16 roles (red/orange/yellow/green/cyan/blue/magenta/brown)
#          while staying in-universe -- Charmander's line supplies the reds and oranges,
#          Squirtle's the gold, cyan and blue, and Bulbasaur's the green plus Venusaur's
#          magenta bloom, which is what finally fills the purple slot base16 expects.
#
# base16 role guide:
#   base00-03  backgrounds (darkest -> highlight/comment)
#   base04-07  foregrounds (muted UI text -> brightest)
#   base08-0F  accent/syntax colors

base00: "161616" # Void Black     - deepest background (image backdrop)
base01: "242018" # Ember Dark     - secondary background (warm tint)
base02: "1E2C2C" # Teal Shadow    - selection / highlight (cool tint)
base03: "484038" # Smolder        - comments / inactive borders
base04: "788078" # Moss Muted     - subdued UI text
base05: "D0C8B0" # Warm Glow      - default foreground
base06: "E0DCC8" # Pale Shell     - bright foreground
base07: "F0F0F0" # Neon White     - brightest foreground (glow highlight)
base08: "E84A32" # Charizard Flame - errors, variables, danger (flame red)
base09: "F08828" # Charmander     - constants, numbers, warnings (body orange)
base0A: "F0C038" # Shell Gold     - classes, search highlights (Squirtle's belly)
base0B: "3CC468" # Bulbasaur      - strings, success, positive (leaf green)
base0C: "38C4C8" # Water Splash   - support, regex, info, links (cyan spray)
base0D: "4098D8" # Squirtle       - functions, headings, primary accent (water blue)
base0E: "C070C8" # Venusaur Bloom - keywords, secondary accent (flower magenta)
base0F: "A85830" # Burnt Ember    - deprecated, embedded, tertiary (dark ember)
